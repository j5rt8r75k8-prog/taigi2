<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>臺語變調按鈕</title>
<style>
:root{
  --bg:#fff8fb;
  --card:#ffffff;
  --pink:#e88eaa;
  --pink-dark:#b95477;
  --pink-light:#fdebf1;
  --line:#eadde2;
  --text:#3b2f34;
  --muted:#7b6d73;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:var(--bg);
  color:var(--text);
}
.wrap{
  max-width:900px;
  margin:0 auto;
  padding:36px 20px 50px;
}
h1{
  margin:0;
  text-align:center;
  font-size:clamp(30px,5vw,48px);
  letter-spacing:.05em;
}
.sub{
  text-align:center;
  color:var(--muted);
  margin-top:10px;
  line-height:1.6;
}
.card{
  margin-top:28px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:26px;
  box-shadow:0 14px 35px rgba(155,92,113,.12);
  padding:26px;
}
.label{
  font-weight:900;
  text-align:center;
  margin-bottom:14px;
  font-size:18px;
}
.tones{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
}
@media(max-width:700px){
  .tones{grid-template-columns:repeat(4,1fr)}
}
.tone{
  border:1.5px solid #e6ccd6;
  background:#fff;
  color:var(--text);
  border-radius:18px;
  min-height:74px;
  font-size:30px;
  font-weight:900;
  cursor:pointer;
  transition:.15s ease;
}
.tone:hover{
  border-color:var(--pink);
  transform:translateY(-2px);
}
.tone.active{
  background:var(--pink);
  color:#fff;
  border-color:var(--pink);
  box-shadow:0 8px 20px rgba(232,142,170,.25);
}
.coda{
  display:none;
  margin-top:18px;
  background:var(--pink-light);
  border-radius:18px;
  padding:16px;
}
.coda.show{display:block}
.coda-title{
  text-align:center;
  font-weight:900;
  margin-bottom:10px;
}
.coda-buttons{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}
.coda-buttons button{
  border:1.5px solid #ddc2cc;
  background:#fff;
  border-radius:999px;
  padding:11px 18px;
  font-weight:800;
  cursor:pointer;
}
.coda-buttons button.active{
  background:#5e5056;
  color:white;
  border-color:#5e5056;
}
.result{
  margin-top:24px;
  text-align:center;
  padding:28px 18px;
  border-radius:22px;
  background:linear-gradient(135deg,#fff7fa,#fff);
  border:1px solid var(--line);
}
.flow{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:24px;
  flex-wrap:wrap;
}
.circle{
  width:126px;
  height:126px;
  border-radius:50%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:3px solid var(--pink);
  background:#fff;
}
.circle.after{
  background:var(--pink);
  color:#fff;
}
.small{
  font-size:14px;
  color:var(--muted);
  font-weight:700;
}
.after .small{color:#fff8fb}
.num{
  font-size:54px;
  line-height:1;
  font-weight:1000;
  margin-top:4px;
}
.arrow{
  font-size:48px;
  color:var(--pink);
  font-weight:1000;
}
.rule{
  display:inline-block;
  margin-top:20px;
  background:var(--pink-light);
  color:var(--pink-dark);
  padding:10px 18px;
  border-radius:999px;
  font-weight:900;
  font-size:20px;
}
.note{
  margin-top:14px;
  color:var(--muted);
  line-height:1.7;
  font-size:14px;
}
.quick{
  margin-top:22px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}
@media(max-width:700px){.quick{grid-template-columns:repeat(2,1fr)}}
.quick div{
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 8px;
  text-align:center;
  background:#fff;
}
.quick b{color:var(--pink-dark)}
</style>
</head>
<body>
<div class="wrap">
  <h1>臺語變調</h1>
  <div class="sub">按一下本調，就能看到變調後的聲調。</div>

  <section class="card">
    <div class="label">選擇本調</div>

    <div class="tones" id="toneButtons">
      <button class="tone active" data-tone="1">1</button>
      <button class="tone" data-tone="2">2</button>
      <button class="tone" data-tone="3">3</button>
      <button class="tone" data-tone="4">4</button>
      <button class="tone" data-tone="5">5</button>
      <button class="tone" data-tone="7">7</button>
      <button class="tone" data-tone="8">8</button>
    </div>

    <div class="coda" id="codaBox">
      <div class="coda-title">選擇入聲韻尾</div>
      <div class="coda-buttons" id="codaButtons">
        <button class="active" data-coda="ptk">-p / -t / -k</button>
        <button data-coda="h">-h</button>
      </div>
    </div>

    <div class="result">
      <div class="flow">
        <div class="circle">
          <div class="small">本調</div>
          <div class="num" id="before">1</div>
        </div>

        <div class="arrow">→</div>

        <div class="circle after">
          <div class="small">變調後</div>
          <div class="num" id="after">7</div>
        </div>
      </div>

      <div class="rule" id="ruleText">1 → 7</div>
      <div class="note" id="noteText">第1聲在連讀中變成第7聲。</div>
    </div>

    <div class="quick">
      <div><b>1→7</b><br>一般</div>
      <div><b>2→1</b><br>一般</div>
      <div><b>3→2</b><br>一般</div>
      <div><b>5→7</b><br>一般</div>
      <div><b>7→3</b><br>一般</div>
      <div><b>4→8</b><br>-p/t/k</div>
      <div><b>4→2</b><br>-h</div>
      <div><b>8→4</b><br>-p/t/k</div>
      <div><b>8→3</b><br>-h</div>
    </div>
  </section>
</div>

<script>
let tone = 1;
let coda = 'ptk';

const toneButtons = document.getElementById('toneButtons');
const codaBox = document.getElementById('codaBox');
const codaButtons = document.getElementById('codaButtons');

function getResult(){
  if(tone===1) return [7,'第1聲在連讀中變成第7聲。'];
  if(tone===2) return [1,'第2聲在連讀中變成第1聲。'];
  if(tone===3) return [2,'第3聲在連讀中變成第2聲。'];
  if(tone===5) return [7,'第5聲在連讀中變成第7聲。'];
  if(tone===7) return [3,'第7聲在連讀中變成第3聲。'];
  if(tone===4 && coda==='ptk') return [8,'第4聲以 -p、-t、-k 收尾時，變成第8聲。'];
  if(tone===4 && coda==='h') return [2,'第4聲以 -h 收尾時，變成第2聲。'];
  if(tone===8 && coda==='ptk') return [4,'第8聲以 -p、-t、-k 收尾時，變成第4聲。'];
  if(tone===8 && coda==='h') return [3,'第8聲以 -h 收尾時，變成第3聲。'];
}

function render(){
  const [after, note] = getResult();
  document.getElementById('before').textContent = tone;
  document.getElementById('after').textContent = after;
  document.getElementById('ruleText').textContent =
    (tone===4 || tone===8)
      ? `${tone} → ${after}（${coda==='ptk' ? '-p / -t / -k' : '-h'}）`
      : `${tone} → ${after}`;
  document.getElementById('noteText').textContent = note;

  codaBox.classList.toggle('show', tone===4 || tone===8);
}

toneButtons.addEventListener('click', e=>{
  const btn = e.target.closest('.tone');
  if(!btn) return;
  tone = Number(btn.dataset.tone);
  document.querySelectorAll('.tone').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

codaButtons.addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  coda = btn.dataset.coda;
  document.querySelectorAll('#codaButtons button').forEach(b=>b.classList.toggle('active', b===btn));
  render();
});

render();
</script>
</body>
</html>
